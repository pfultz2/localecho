[tox]
envlist = py311, py312, py313, integration, lint
skip_missing_interpreters = true

[testenv]
description = fast unit tests
extras = test
commands = pytest -m "not integration" {posargs}

[testenv:integration]
description = end-to-end tests through a simulated high-latency link
extras = test
commands = pytest -m integration {posargs}

[testenv:lint]
description = static checks
skip_install = true
deps = pyflakes
commands = pyflakes localecho.py tests
